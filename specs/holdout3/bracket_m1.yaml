id: bracket_m1
family: bracket
difficulty: easy
text: >
  L-bracket made of 4 mm plate, 30 mm wide (Y). The horizontal leg lies on the
  XY plane and is 50 mm long in X. The vertical leg rises along +Z from the
  maximum-X end of the horizontal leg to an overall height of 40 mm, its outer
  face flush with that end. One 5 mm hole along Z through the horizontal leg at
  X = 20 mm, Y = 15 mm.
constraints:
  bbox: [50, 30, 40]
  thickness_min: 4
  holes:
    - {d: 5, depth: 4, axis: z, at: [[20, 15]]}
reference: |
  import cadquery as cq

  base = cq.Workplane("XY").box(50, 30, 4, centered=False)
  upright = cq.Workplane("XY").box(4, 30, 40, centered=False).translate((46, 0, 0))
  hole = cq.Workplane("XY").center(20, 15).circle(2.5).extrude(4)
  result = base.union(upright).cut(hole)
broken:
  - {expect: hole_position, replace: ['center(20, 15)', 'center(25, 15)']}
  - {expect: volume, replace: ['box(4, 30, 40', 'box(6, 30, 40']}
