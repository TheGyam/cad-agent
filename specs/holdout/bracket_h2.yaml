id: bracket_h2
family: bracket
difficulty: medium
text: >
  L-bracket made of 6 mm plate, 60 mm wide (Y). The horizontal leg lies on the
  XY plane and is 70 mm long in X. The vertical leg rises along +Z from the
  maximum-X end of the horizontal leg to an overall height of 45 mm, its outer
  face flush with that end. Two 6.5 mm holes along Z through the horizontal leg
  at X = 20 mm, Y = 15 and 45 mm. Two 6.5 mm holes along X through the vertical
  leg at Y = 15 and 45 mm, 30 mm above the bottom face.
constraints:
  bbox: [70, 60, 45]
  thickness_min: 6
  holes:
    - {d: 6.5, depth: 6, axis: z, at: [[20, 15], [20, 45]]}
    - {d: 6.5, depth: 6, axis: x, at: [[15, 30], [45, 30]]}
reference: |
  import cadquery as cq

  base = cq.Workplane("XY").box(70, 60, 6, centered=False)
  upright = cq.Workplane("XY").box(6, 60, 45, centered=False).translate((64, 0, 0))
  holes_z = cq.Workplane("XY").pushPoints([(20, 15), (20, 45)]).circle(3.25).extrude(6)
  holes_x = cq.Workplane("YZ", origin=(64, 0, 0)).pushPoints([(15, 30), (45, 30)]).circle(3.25).extrude(6)
  result = base.union(upright).cut(holes_z).cut(holes_x)
broken:
  - {expect: hole_count, replace: ['.cut(holes_x)', '']}
  - {expect: hole_position, replace: ['[(15, 30), (45, 30)]', '[(15, 25), (45, 25)]']}
