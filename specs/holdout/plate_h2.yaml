id: plate_h2
family: plate
difficulty: medium
text: >
  Square plate 90 mm by 90 mm (X and Y), 10 mm thick (Z), with its four vertical
  corner edges rounded to an 8 mm radius. A 30 mm diameter through hole along Z
  at the centre, and four 6.6 mm through holes along Z, each 12 mm from the two
  nearest edges.
constraints:
  bbox: [90, 90, 10]
  holes:
    - {d: 30, depth: 10, axis: z, at: [[45, 45]]}
    - {d: 6.6, depth: 10, axis: z, at: [[12, 12], [78, 12], [12, 78], [78, 78]]}
reference: |
  import cadquery as cq

  plate = cq.Workplane("XY").box(90, 90, 10, centered=False).edges("|Z").fillet(8)
  centre = cq.Workplane("XY").center(45, 45).circle(15).extrude(10)
  corners = cq.Workplane("XY").pushPoints([(12, 12), (78, 12), (12, 78), (78, 78)]).circle(3.3).extrude(10)
  result = plate.cut(centre).cut(corners)
broken:
  - {expect: shape_mismatch, replace: ['.fillet(8)', '.fillet(3)']}
  - {expect: hole_diameter, replace: ['circle(15)', 'circle(14)']}
  - {expect: hole_position, replace: ['(78, 12), (12, 78)', '(78, 12), (12, 74)']}
