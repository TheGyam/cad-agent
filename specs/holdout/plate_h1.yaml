id: plate_h1
family: plate
difficulty: easy
text: >
  Flat bar 120 mm (X) by 40 mm (Y), 5 mm thick (Z), with three 8 mm diameter
  through holes along Z on its centre line (Y = 20 mm), at X = 20, 60 and 100 mm.
constraints:
  bbox: [120, 40, 5]
  holes:
    - {d: 8, depth: 5, axis: z, at: [[20, 20], [60, 20], [100, 20]]}
reference: |
  import cadquery as cq

  bar = cq.Workplane("XY").box(120, 40, 5, centered=False)
  holes = cq.Workplane("XY").pushPoints([(20, 20), (60, 20), (100, 20)]).circle(4).extrude(5)
  result = bar.cut(holes)
broken:
  - {expect: hole_position, replace: ['(60, 20), (100, 20)', '(60, 20), (95, 20)']}
  - {expect: hole_count, replace: ['[(20, 20), (60, 20), (100, 20)]', '[(20, 20), (100, 20)]']}
