name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries for OpenCASCADE and VTK
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1
      - run: pip install -e ".[dev]"
      - run: pytest -q
